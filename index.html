<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>中一視藝科：自畫像「三庭五眼」神探挑戰</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #10b981;
      --guide-color: #ef4444; /* 參考圖標示紅色 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #fef3c7 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      overflow-x: hidden;
    }

    /* 容器設計 */
    .screen {
      display: none;
      width: 100%;
      max-width: 1100px;
      min-height: 700px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px);
      padding: 24px;
      margin: 16px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* 登入設定畫面 */
    #screen-setup {
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 600px;
    }

    .title-badge {
      display: inline-block;
      background: #e0e7ff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 8px;
      color: #1e1b4b;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .form-group {
      width: 100%;
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .form-row .form-group {
      flex: 1;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .opt-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }

    .opt-card:hover {
      border-color: #a5b4fc;
    }

    .opt-card.selected {
      border-color: var(--primary);
      background: #eef2ff;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-main {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    /* 遊戲主畫面頂部 */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 2px dashed var(--border);
    }

    .user-tag {
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
    }

    .tool-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-tool {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-guideline {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }

    .btn-guideline.active {
      background: #fee2e2;
      color: #991b1b;
      border-color: #ef4444;
      font-weight: 700;
    }

    .btn-hint {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .btn-hint:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-finish {
      background: #4f46e5;
      color: white;
    }

    /* 操作區：畫布與五官欄 */
    .game-workspace {
      display: flex;
      flex: 1;
      gap: 20px;
      margin-top: 16px;
      min-height: 560px;
      position: relative;
    }

    /* 畫布容器 */
    .canvas-container {
      flex: 1;
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    #stage-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 右側五官部件選擇欄 */
    .parts-panel {
      width: 250px;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    .parts-panel h3 {
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 4px;
      text-align: center;
    }

    .parts-panel p {
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }

    .parts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      overflow-y: auto;
      max-height: 480px;
      padding: 4px;
    }

    .part-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .part-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
    }

    .part-btn.on-canvas {
      border-color: var(--success);
      background: #f0fdf4;
    }

    .part-btn svg {
      width: 55px;
      height: 45px;
      pointer-events: none;
    }

    .part-btn span {
      font-size: 0.8rem;
      color: #475569;
      font-weight: 600;
    }

    /* 畫布上已放置部件物件樣式與變換框 */
    .placed-part-wrapper {
      position: absolute;
      z-index: 10;
      cursor: move;
      touch-action: none;
      transform-origin: center center;
    }

    .placed-part-wrapper.selected {
      z-index: 50;
      outline: 2px dashed #4f46e5;
      outline-offset: 4px;
    }

    /* 縮放控點 */
    .resize-handle {
      display: none;
      position: absolute;
      width: 14px;
      height: 14px;
      background: #4f46e5;
      border: 2px solid #ffffff;
      border-radius: 50%;
      z-index: 60;
    }

    .placed-part-wrapper.selected .resize-handle {
      display: block;
    }

    .handle-se {
      bottom: -10px;
      right: -10px;
      cursor: se-resize;
    }

    .handle-nw {
      top: -10px;
      left: -10px;
      cursor: nw-resize;
    }

    /* 選中時的浮動微調按鈕列 */
    .transform-toolbar {
      display: none;
      position: absolute;
      bottom: -46px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border-radius: 8px;
      padding: 4px 6px;
      gap: 6px;
      z-index: 70;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .placed-part-wrapper.selected .transform-toolbar {
      display: flex;
    }

    .tb-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tb-btn:hover {
      background: #475569;
    }

    .tb-btn-del {
      background: #ef4444;
    }

    /* 5秒提示倒數浮條 */
    .hint-banner {
      display: none;
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #fef08a;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 80;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.04); }
    }

    /* 結果彈窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 540px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .result-badge {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .score-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .comment-box {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #334155;
      text-align: left;
      margin: 16px 0;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }

    .btn-download {
      background: var(--success);
      color: white;
    }

    .btn-restart {
      background: #e2e8f0;
      color: #475569;
    }

    /* 手機 / iPad 直向響應式調整 */
    @media (max-width: 820px) {
      .game-workspace {
        flex-direction: column;
      }
      .parts-panel {
        width: 100%;
        max-height: 180px;
      }
      .parts-grid {
        display: flex;
        overflow-x: auto;
        max-height: none;
      }
      .part-btn {
        min-width: 85px;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 登入與造型選擇設定介面 -->
  <div id="screen-setup" class="screen active">
    <span class="title-badge">中一視覺藝術科 • 自畫像單元</span>
    <h1>🎨「三庭五眼」神探挑戰</h1>
    <p class="subtitle">依據面孔黃金比例（橫三等分 1/3、直五等分 1/5），自主拼砌合比例的自畫像！</p>

    <div class="form-row">
      <div class="form-group">
        <label>班別 (Class)</label>
        <input type="text" id="input-class" placeholder="例如：1A" maxlength="4" />
      </div>
      <div class="form-group">
        <label>學號 (Class No.)</label>
        <input type="number" id="input-no" placeholder="例如：15" min="1" max="50" />
      </div>
      <div class="form-group">
        <label>學生姓名 (Name)</label>
        <input type="text" id="input-name" placeholder="例如：陳大文" maxlength="10" />
      </div>
    </div>

    <!-- 性別選擇 -->
    <div class="form-group">
      <label>1. 選擇自畫像性別 (Gender)</label>
      <div class="options-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="opt-card selected" onclick="selectGender('male', this)">👦 男生造型（清爽短髮）</div>
        <div class="opt-card" onclick="selectGender('female', this)">👧 女生造型（俐落紮髮）</div>
      </div>
    </div>

    <!-- 面型選擇 -->
    <div class="form-group">
      <label>2. 選擇面型 (Face Shape)</label>
      <div class="options-grid">
        <div class="opt-card selected" onclick="selectFace('oval', this)">🥚 鵝蛋臉 (標準)</div>
        <div class="opt-card" onclick="selectFace('round', this)">🌕 圓形臉</div>
        <div class="opt-card" onclick="selectFace('square', this)">◻️ 方形臉</div>
      </div>
    </div>

    <button class="btn-main" onclick="startGame()">🚀 進入畫室，開始創作！</button>
  </div>

  <!-- 2. 遊戲互動工作區 -->
  <div id="screen-game" class="screen">
    <!-- 頂部資訊列與功能鍵 -->
    <div class="game-header">
      <div class="user-tag" id="display-user-info">1A (15) 陳大文</div>
      <div class="tool-bar">
        <!-- 預設關閉標示線，按鈕未亮起 -->
        <button class="btn-tool btn-guideline" id="btn-toggle-grid" onclick="toggleGrid()">
          📐 開啟三庭五眼標示
        </button>
        <button class="btn-tool btn-hint" id="btn-hint" onclick="triggerHint()">
          💡 正確位置提示 (5秒)
        </button>
        <button class="btn-tool btn-finish" onclick="checkAndFinish()">
          ✅ 完成並評分
        </button>
      </div>
    </div>

    <!-- 畫布與右側五官部件盤 -->
    <div class="game-workspace">
      <!-- 畫布主容器 -->
      <div class="canvas-container" id="canvas-container">
        <div class="hint-banner" id="hint-banner">💡 5秒黃金比例提示中：<span id="hint-countdown">5</span> 秒</div>
        <canvas id="stage-canvas"></canvas>
      </div>

      <!-- 右側五官選擇欄 -->
      <div class="parts-panel">
        <h3>五官選擇欄</h3>
        <p>點擊部件即可上屏，可自由拖曳、放大縮小</p>
        <div class="parts-grid" id="parts-palette">
          <!-- 透過 JS 動態生成按鈕 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 3. 結果與作品匯出彈窗 -->
  <div class="modal-overlay" id="result-modal">
    <div class="modal-card">
      <div class="result-badge" id="res-emoji">🎉</div>
      <div class="score-text" id="res-score">比例精準度：92%</div>
      <div class="comment-box" id="res-comment">
        評語載入中...
      </div>
      <div class="modal-actions">
        <button class="btn-restart" onclick="restartGame()">🔄 繼續調整</button>
        <button class="btn-download" onclick="downloadArtworkCard()">📥 下載自畫像作品卡</button>
      </div>
    </div>
  </div>

  <script>
    // --- 遊戲全局狀態 ---
    const gameState = {
      userClass: '',
      userNo: '',
      userName: '',
      gender: 'male',
      faceShape: 'oval',
      showGrid: false, // 需求 4：標示線預設隱藏
      hintActive: false,
      hintTimer: null,
      // 邏輯畫布規格 540 x 620
      logicalWidth: 540,
      logicalHeight: 620,
      faceBounds: { x: 110, y: 115, width: 300, height: 390 },
      // 已在畫面上的部件物件列表
      partsOnCanvas: {}, // key -> { id, key, x, y, scale, rotation }
      selectedPartId: null
    };

    // 標準黃金比例理想目標（對齊參考相片：上庭 115~245, 中庭 245~375, 下庭 375~505）
    const idealTargets = {
      eyebrow_l: { x: 200, y: 242, name: '左眉', w: 70, h: 25 },
      eyebrow_r: { x: 320, y: 242, name: '右眉', w: 70, h: 25 },
      eye_l:     { x: 200, y: 272, name: '左眼', w: 65, h: 32 },
      eye_r:     { x: 320, y: 272, name: '右眼', w: 65, h: 32 },
      nose:      { x: 260, y: 365, name: '鼻子', w: 45, h: 65 },
      mouth:     { x: 260, y: 440, name: '嘴巴', w: 75, h: 40 },
      ear_l:     { x: 105, y: 295, name: '左耳', w: 32, h: 75 },
      ear_r:     { x: 415, y: 295, name: '右耳', w: 32, h: 75 }
    };

    // 向量五官圖形定義（保證免外鏈，離線流暢加載）
    const partSVGs = {
      eyebrow_l: `<svg viewBox="0 0 70 25"><path d="M5,18 Q35,6 65,14" stroke="#1f2937" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>`,
      eyebrow_r: `<svg viewBox="0 0 70 25"><path d="M5,14 Q35,6 65,18" stroke="#1f2937" stroke-width="4.5" stroke-linecap="round" fill="none"/></svg>`,
      eye_l:     `<svg viewBox="0 0 65 32"><ellipse cx="32.5" cy="16" rx="26" ry="12" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="32.5" cy="16" r="7.5" fill="#1f2937"/><circle cx="35" cy="13.5" r="2.5" fill="#fff"/></svg>`,
      eye_r:     `<svg viewBox="0 0 65 32"><ellipse cx="32.5" cy="16" rx="26" ry="12" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="32.5" cy="16" r="7.5" fill="#1f2937"/><circle cx="29.5" cy="13.5" r="2.5" fill="#fff"/></svg>`,
      nose:      `<svg viewBox="0 0 45 65"><path d="M22,5 L20,44 Q13,47 10,54 Q22.5,62 35,54 Q32,47 25,44" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
      mouth:     `<svg viewBox="0 0 75 40"><path d="M8,18 Q37.5,6 67,18 Q37.5,36 8,18 Z" fill="#f43f5e" stroke="#be123c" stroke-width="2"/><line x1="8" y1="18" x2="67" y2="18" stroke="#9f1239" stroke-width="1.5"/></svg>`,
      ear_l:     `<svg viewBox="0 0 32 75"><path d="M28,6 C5,6 5,68 28,68 Q16,36 28,15" stroke="#475569" stroke-width="3" fill="#fed7aa"/></svg>`,
      ear_r:     `<svg viewBox="0 0 32 75"><path d="M4,6 C27,6 27,68 4,68 Q16,36 4,15" stroke="#475569" stroke-width="3" fill="#fed7aa"/></svg>`
    };

    // --- 選單互動 ---
    function selectGender(gen, el) {
      gameState.gender = gen;
      el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function selectFace(shape, el) {
      gameState.faceShape = shape;
      el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    function startGame() {
      const uClass = document.getElementById('input-class').value.trim();
      const uNo = document.getElementById('input-no').value.trim();
      const uName = document.getElementById('input-name').value.trim();

      if (!uClass || !uNo || !uName) {
        alert('請先填寫班別、學號及姓名，以便登記自畫像作品！');
        return;
      }

      gameState.userClass = uClass.toUpperCase();
      gameState.userNo = uNo;
      gameState.userName = uName;

      document.getElementById('display-user-info').innerText =
        `班別：${gameState.userClass} | 學號：${gameState.userNo} | 姓名：${gameState.userName}`;

      document.getElementById('screen-setup').classList.remove('active');
      document.getElementById('screen-game').classList.add('active');

      initWorkspace();
    }

    // --- 畫布與工作區初始化 ---
    const canvas = document.getElementById('stage-canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeStage() {
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawStage();
      // 同步更新已存在 DOM 的定位
      for (const key in gameState.partsOnCanvas) {
        syncDomPosition(key);
      }
    }

    window.addEventListener('resize', resizeStage);

    // 點擊畫布空白處取消選取
    container.addEventListener('pointerdown', (e) => {
      if (e.target === container || e.target === canvas) {
        selectPart(null);
      }
    });

    function initWorkspace() {
      resizeStage();
      populatePartsTray();
    }

    // 建立右側五官選項欄按鈕
    function populatePartsTray() {
      const tray = document.getElementById('parts-palette');
      tray.innerHTML = '';
      container.querySelectorAll('.placed-part-wrapper').forEach(e => e.remove());
      gameState.partsOnCanvas = {};

      for (const [key, target] of Object.entries(idealTargets)) {
        const btn = document.createElement('div');
        btn.className = 'part-btn';
        btn.id = `tray-btn-${key}`;
        btn.innerHTML = `
          ${partSVGs[key]}
          <span>${target.name}</span>
        `;
        // 需求 1：點擊按鈕直接生成在畫面上
        btn.addEventListener('click', () => onTrayButtonClick(key));
        tray.appendChild(btn);
      }
    }

    // 點擊右側按鈕的邏輯
    function onTrayButtonClick(key) {
      if (gameState.partsOnCanvas[key]) {
        // 如果已經在畫面上，直接選中它並置頂提示
        selectPart(key);
        return;
      }
      // 生成在畫面正中央附近
      addPartToCanvas(key, gameState.logicalWidth / 2, gameState.logicalHeight / 2 - 20);
      selectPart(key);
    }

    // 需求 1 & 2：生成可自由移動與縮放的部件
    function addPartToCanvas(key, logicalX, logicalY) {
      const def = idealTargets[key];
      const partData = {
        id: `placed-${key}`,
        key: key,
        x: logicalX,
        y: logicalY,
        width: def.w,
        height: def.h,
        scale: 1.0,
        rotation: 0
      };

      gameState.partsOnCanvas[key] = partData;

      // 建立 DOM 元件
      const wrapper = document.createElement('div');
      wrapper.className = 'placed-part-wrapper';
      wrapper.id = partData.id;
      wrapper.style.width = `${def.w}px`;
      wrapper.style.height = `${def.h}px`;

      wrapper.innerHTML = `
        <div class="part-svg-inner" style="width:100%;height:100%;">${partSVGs[key]}</div>
        <!-- 縮放手柄 -->
        <div class="resize-handle handle-se" data-handle="se"></div>
        <div class="resize-handle handle-nw" data-handle="nw"></div>
        <!-- 快捷調整列 -->
        <div class="transform-toolbar">
          <button class="tb-btn" onclick="adjustScale('${key}', 0.1)">➕ 放大</button>
          <button class="tb-btn" onclick="adjustScale('${key}', -0.1)">➖ 縮小</button>
          <button class="tb-btn" onclick="rotatePart('${key}', 15)">🔄 旋轉</button>
          <button class="tb-btn tb-btn-del" onclick="removePart('${key}')">🗑️ 移除</button>
        </div>
      `;

      container.appendChild(wrapper);
      syncDomPosition(key);
      bindTransformEvents(wrapper, key);

      // 更新右側面板按鈕外觀狀態
      const trayBtn = document.getElementById(`tray-btn-${key}`);
      if (trayBtn) {
        trayBtn.classList.add('on-canvas');
        trayBtn.querySelector('span').innerText = `${def.name} ✓`;
      }
    }

    function selectPart(key) {
      gameState.selectedPartId = key;
      document.querySelectorAll('.placed-part-wrapper').forEach(w => {
        w.classList.remove('selected');
      });
      if (key && document.getElementById(`placed-${key}`)) {
        document.getElementById(`placed-${key}`).classList.add('selected');
      }
    }

    function adjustScale(key, delta) {
      const p = gameState.partsOnCanvas[key];
      if (!p) return;
      p.scale = Math.max(0.4, Math.min(2.5, p.scale + delta));
      syncDomPosition(key);
    }

    function rotatePart(key, deg) {
      const p = gameState.partsOnCanvas[key];
      if (!p) return;
      p.rotation = (p.rotation + deg) % 360;
      syncDomPosition(key);
    }

    function removePart(key) {
      const el = document.getElementById(`placed-${key}`);
      if (el) el.remove();
      delete gameState.partsOnCanvas[key];
      if (gameState.selectedPartId === key) gameState.selectedPartId = null;

      const trayBtn = document.getElementById(`tray-btn-${key}`);
      if (trayBtn) {
        trayBtn.classList.remove('on-canvas');
        trayBtn.querySelector('span').innerText = idealTargets[key].name;
      }
    }

    // 將邏輯座標與大小同步至 DOM 畫面
    function syncDomPosition(key) {
      const p = gameState.partsOnCanvas[key];
      const el = document.getElementById(`placed-${key}`);
      if (!p || !el) return;

      const rect = container.getBoundingClientRect();
      const scaleToDomX = rect.width / gameState.logicalWidth;
      const scaleToDomY = rect.height / gameState.logicalHeight;

      const domX = p.x * scaleToDomX;
      const domY = p.y * scaleToDomY;
      const domW = p.width * scaleToDomX * p.scale;
      const domH = p.height * scaleToDomY * p.scale;

      el.style.width = `${domW}px`;
      el.style.height = `${domH}px`;
      el.style.left = `${domX - domW / 2}px`;
      el.style.top = `${domY - domH / 2}px`;
      el.style.transform = `rotate(${p.rotation}deg)`;
    }

    // 拖曳移動與拖曳縮放事件綁定
    function bindTransformEvents(wrapper, key) {
      let isDragging = false;
      let isResizing = false;
      let startClientX = 0, startClientY = 0;
      let startLogicalX = 0, startLogicalY = 0;
      let startScale = 1.0;

      wrapper.addEventListener('pointerdown', (e) => {
        // 如果點擊的是按鈕列，不觸發拖曳
        if (e.target.closest('.transform-toolbar')) return;

        selectPart(key);
        const p = gameState.partsOnCanvas[key];
        const rect = container.getBoundingClientRect();
        const scaleX = gameState.logicalWidth / rect.width;

        if (e.target.classList.contains('resize-handle')) {
          // 縮放模式
          isResizing = true;
          startClientX = e.clientX;
          startClientY = e.clientY;
          startScale = p.scale;
        } else {
          // 移動模式
          isDragging = true;
          startClientX = e.clientX;
          startClientY = e.clientY;
          startLogicalX = p.x;
          startLogicalY = p.y;
        }

        wrapper.setPointerCapture(e.pointerId);
        e.stopPropagation();
      });

      wrapper.addEventListener('pointermove', (e) => {
        const p = gameState.partsOnCanvas[key];
        if (!p) return;

        const rect = container.getBoundingClientRect();
        const scaleToLogicalX = gameState.logicalWidth / rect.width;
        const scaleToLogicalY = gameState.logicalHeight / rect.height;

        if (isDragging) {
          const dx = (e.clientX - startClientX) * scaleToLogicalX;
          const dy = (e.clientY - startClientY) * scaleToLogicalY;
          p.x = startLogicalX + dx;
          p.y = startLogicalY + dy;
          syncDomPosition(key);
        } else if (isResizing) {
          const distChange = (e.clientX - startClientX);
          const newScale = Math.max(0.4, Math.min(2.5, startScale + distChange / 100));
          p.scale = newScale;
          syncDomPosition(key);
        }
      });

      const stopInteraction = (e) => {
        if (isDragging || isResizing) {
          isDragging = false;
          isResizing = false;
          try { wrapper.releasePointerCapture(e.pointerId); } catch(err) {}
        }
      };

      wrapper.addEventListener('pointerup', stopInteraction);
      wrapper.addEventListener('pointercancel', stopInteraction);
    }

    // --- 繪製畫布底層（面型、完全不遮面部的乾淨髮型、標示線、5秒提示）---
    function drawStage() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const sx = w / gameState.logicalWidth;
      const sy = h / gameState.logicalHeight;

      ctx.save();
      ctx.scale(sx, sy);

      const fb = gameState.faceBounds;

      // 1. 頸部與肩部
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.rect(fb.x + 85, fb.y + 350, 130, 150);
      ctx.fill();
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 2. 繪製面形輪廓
      ctx.fillStyle = '#ffedd5';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 3.5;
      ctx.beginPath();

      if (gameState.faceShape === 'oval') {
        // 標準鵝蛋面
        ctx.ellipse(fb.x + fb.width/2, fb.y + fb.height/2, fb.width/2, fb.height/2, 0, 0, Math.PI * 2);
      } else if (gameState.faceShape === 'round') {
        // 圓臉
        ctx.ellipse(fb.x + fb.width/2, fb.y + fb.height/2, fb.width/1.9, fb.height/2.25, 0, 0, Math.PI * 2);
      } else {
        // 方形臉
        const x = fb.x + 10, y = fb.y + 15, bw = fb.width - 20, bh = fb.height - 20, r = 50;
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + bw, y, x + bw, y + bh, r);
        ctx.arcTo(x + bw, y + bh, x, y + bh, r);
        ctx.arcTo(x, y + bh, x, y, r);
        ctx.arcTo(x, y, x + bw, y, r);
      }
      ctx.fill();
      ctx.stroke();

      // 3. 需求 3：繪製髮型 —— 向上/向後梳起，嚴格不遮擋發際線與面部
      drawUnobtrusiveHair(ctx, fb, gameState.gender);

      // 4. 需求 4：三庭五眼標示線（預設隱藏，待開啟才繪製）
      if (gameState.showGrid) {
        drawStandardSanTingWuYan(ctx, fb);
      }

      // 5. 繪製 5 秒提示虛影
      if (gameState.hintActive) {
        drawHintTargets(ctx);
      }

      ctx.restore();
    }

    // 需求 3：完全不遮擋面部與額頭發際線的髮型設計
    function drawUnobtrusiveHair(ctx, fb, gender) {
      ctx.save();
      ctx.fillStyle = '#1e293b';

      if (gender === 'male') {
        // 男生：清爽後梳/向上蓬鬆短髮，發際線完整露出
        ctx.beginPath();
        // 髮頂高高隆起，輪廓完全在面部頂部外圍
        ctx.arc(fb.x + fb.width/2, fb.y + 40, fb.width/1.8, Math.PI * 0.95, Math.PI * 2.05);
        // 連接至耳上方，額頭完整留白
        ctx.quadraticCurveTo(fb.x + fb.width/2, fb.y - 10, fb.x + 12, fb.y + 120);
        ctx.fill();
      } else {
        // 女生：俐落高馬尾/向後盤髮，完全露額頭
        // 頂部盤髮
        ctx.beginPath();
        ctx.arc(fb.x + fb.width/2, fb.y + 55, fb.width/1.82, Math.PI * 0.92, Math.PI * 2.08);
        ctx.quadraticCurveTo(fb.x + fb.width/2, fb.y - 5, fb.x + 15, fb.y + 130);
        ctx.fill();

        // 腦後高馬尾紮髮（落在肩膀兩側後方，不遮擋面部兩頰）
        ctx.beginPath();
        ctx.ellipse(fb.x + fb.width/2, fb.y - 15, 36, 42, 0, 0, Math.PI * 2);
        ctx.fill();

        // 兩側耳後垂髮（置於外側）
        ctx.fillRect(fb.x - 18, fb.y + 190, 26, 220);
        ctx.fillRect(fb.x + fb.width - 8, fb.y + 190, 26, 220);
      }
      ctx.restore();
    }

    // 標準「三庭五眼」網格與標籤標示（參考劉亦菲相片）
    function drawStandardSanTingWuYan(ctx, fb) {
      ctx.save();

      // 基準劃分：
      // 髮際線 y0 = fb.y (115)
      // 眉心線 y1 = fb.y + fb.height * (1/3) = 245
      // 鼻底線 y2 = fb.y + fb.height * (2/3) = 375
      // 下巴底 y3 = fb.y + fb.height = 505
      const y0 = fb.y;
      const y1 = fb.y + (fb.height / 3);
      const y2 = fb.y + (fb.height / 3) * 2;
      const y3 = fb.y + fb.height;

      const guideColor = '#ef4444'; // 參考相片珊瑚紅
      const labelColor = '#475569';

      ctx.strokeStyle = guideColor;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([6, 4]);

      // 橫向「三庭」輔助虛線
      const hExtRight = fb.x + fb.width + 80;
      const hExtLeft = fb.x - 30;

      [y0, y1, y2, y3].forEach(y => {
        ctx.beginPath();
        ctx.moveTo(hExtLeft, y);
        ctx.lineTo(hExtRight, y);
        ctx.stroke();
      });

      // 直向「五眼」輔助虛線
      const vTop = fb.y - 80;
      const vBottom = y3 + 45;
      const eyeWidth = fb.width / 5; // 60px

      for (let i = 0; i <= 5; i++) {
        const x = fb.x + eyeWidth * i;
        ctx.beginPath();
        ctx.moveTo(x, vTop);
        ctx.lineTo(x, vBottom);
        ctx.stroke();
      }

      // 文字與箭頭/尺度線標示
      ctx.setLineDash([]);
      ctx.font = 'bold 15px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // (A) 頂部「1/5」比例標籤
      ctx.fillStyle = labelColor;
      for (let i = 0; i < 5; i++) {
        const centerX = fb.x + eyeWidth * i + eyeWidth / 2;
        ctx.fillText('1/5', centerX, vTop + 32);
      }

      // (B) 右側「1/3」三庭標籤與量度軸線
      const rulerX = fb.x + fb.width + 50;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(rulerX, y0);
      ctx.lineTo(rulerX, y3);
      ctx.stroke();

      ctx.fillStyle = labelColor;
      ctx.fillText('1/3', rulerX + 24, (y0 + y1) / 2); // 上庭
      ctx.fillText('1/3', rulerX + 24, (y1 + y2) / 2); // 中庭
      ctx.fillText('1/3', rulerX + 24, (y2 + y3) / 2); // 下庭

      // 左下方教學指引註記
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#dc2626';
      ctx.textAlign = 'left';
      ctx.fillText('• 橫三庭：髮際至眉、眉至鼻底、鼻底至下巴各佔 1/3', fb.x - 20, vBottom + 25);
      ctx.fillText('• 直五眼：兩眼間距 = 一隻眼之寬 = 左右外側各佔 1/5', fb.x - 20, vBottom + 43);

      ctx.restore();
    }

    // 繪製 5 秒半透明位置指引
    function drawHintTargets(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(79, 70, 229, 0.2)';
      ctx.strokeStyle = '#4338ca';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);

      for (const [key, pos] of Object.entries(idealTargets)) {
        ctx.beginPath();
        if (key.includes('eye') || key.includes('mouth')) {
          ctx.ellipse(pos.x, pos.y, 28, 14, 0, 0, Math.PI * 2);
        } else if (key === 'nose') {
          ctx.ellipse(pos.x, pos.y, 18, 28, 0, 0, Math.PI * 2);
        } else {
          ctx.rect(pos.x - 22, pos.y - 12, 44, 24);
        }
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#312e81';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(pos.name, pos.x - 12, pos.y - 18);
      }
      ctx.restore();
    }

    // 需求 4：控制列按鈕切換標示線開啟/關閉
    function toggleGrid() {
      gameState.showGrid = !gameState.showGrid;
      const btn = document.getElementById('btn-toggle-grid');
      btn.classList.toggle('active', gameState.showGrid);
      btn.innerText = gameState.showGrid ? '📐 關閉三庭五眼標示' : '📐 開啟三庭五眼標示';
      drawStage();
    }

    function triggerHint() {
      if (gameState.hintActive) return;

      gameState.hintActive = true;
      const banner = document.getElementById('hint-banner');
      const countEl = document.getElementById('hint-countdown');
      const hintBtn = document.getElementById('btn-hint');

      banner.style.display = 'block';
      hintBtn.disabled = true;

      let remaining = 5;
      countEl.innerText = remaining;
      drawStage();

      if (gameState.hintTimer) clearInterval(gameState.hintTimer);
      gameState.hintTimer = setInterval(() => {
        remaining -= 1;
        countEl.innerText = remaining;

        if (remaining <= 0) {
          clearInterval(gameState.hintTimer);
          gameState.hintActive = false;
          banner.style.display = 'none';
          hintBtn.disabled = false;
          drawStage();
        }
      }, 1000);
    }

    // --- 成績計算與評分審核 ---
    function checkAndFinish() {
      selectPart(null); // 取消選擇框
      const keys = Object.keys(idealTargets);
      const placedKeys = Object.keys(gameState.partsOnCanvas);

      if (placedKeys.length < 5) {
        alert('請先在畫面上放置眼睛、鼻子、嘴巴等核心五官後再進行評分！');
        return;
      }

      let totalScore = 0;
      for (const key of keys) {
        if (gameState.partsOnCanvas[key]) {
          const placed = gameState.partsOnCanvas[key];
          const ideal = idealTargets[key];
          const dist = Math.hypot(placed.x - ideal.x, placed.y - ideal.y);
          // 距離 35 像素以內即獲高分，並計算大小合適度
          const posScore = Math.max(0, 100 - (dist * 1.3));
          const scaleScore = Math.max(0, 100 - Math.abs(1.0 - placed.scale) * 60);
          totalScore += (posScore * 0.8 + scaleScore * 0.2);
        }
      }

      const finalScore = Math.round(totalScore / keys.length);

      let emoji = '🌟';
      let comment = '';

      if (finalScore >= 85) {
        emoji = '🏆';
        comment = `太厲害了！你完全掌握了標準「三庭五眼」的黃金比例！五眼寬度（1/5）分配均衡，中庭鼻底線與眼睛高度非常精準！`;
      } else if (finalScore >= 70) {
        emoji = '👏';
        comment = `做得很好！大部分五官位置與縮放比例都很協調。每人容貌雖各具特色，但在自畫像起稿時，維持眼距為「一眼之寬」能令結構更穩健！`;
      } else {
        emoji = '🎨';
        comment = `已具備基礎輪廓！建議打開上方「📐 開啟三庭五眼標示」對齊紅色的 1/3 及 1/5 比例輔助線，特別注意眼睛是否坐落在橫線之間，再試一次！`;
      }

      document.getElementById('res-emoji').innerText = emoji;
      document.getElementById('res-score').innerText = `比例準確度：${finalScore}%`;
      document.getElementById('res-comment').innerHTML = `
        <strong>【教師觀課與課堂目標評析】</strong><br>
        學生：${gameState.userClass} (${gameState.userNo}) ${gameState.userName}<br>
        ${comment}
      `;

      document.getElementById('result-modal').style.display = 'flex';
    }

    function restartGame() {
      document.getElementById('result-modal').style.display = 'none';
    }

    // --- 合成並下載作品卡 ---
    function downloadArtworkCard() {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = 900;
      offCanvas.height = 1100;
      const oCtx = offCanvas.getContext('2d');

      // 背景色與外框設計
      oCtx.fillStyle = '#f8fafc';
      oCtx.fillRect(0, 0, offCanvas.width, offCanvas.height);

      oCtx.fillStyle = '#ffffff';
      oCtx.roundRect(40, 40, 820, 1020, 20);
      oCtx.fill();
      oCtx.lineWidth = 4;
      oCtx.strokeStyle = '#4f46e5';
      oCtx.stroke();

      // 標題區域
      oCtx.fillStyle = '#1e1b4b';
      oCtx.font = 'bold 30px sans-serif';
      oCtx.textAlign = 'center';
      oCtx.fillText('視覺藝術科《自畫像：三庭五眼》課堂作品卡', 450, 105);

      oCtx.fillStyle = '#64748b';
      oCtx.font = '18px sans-serif';
      oCtx.fillText(`班別：${gameState.userClass}   學號：${gameState.userNo}   學生姓名：${gameState.userName}   日期：${new Date().toLocaleDateString('zh-HK')}`, 450, 145);

      // 作品區
      const portraitBox = { x: 180, y: 175, w: 540, h: 620 };
      oCtx.fillStyle = '#ffffff';
      oCtx.fillRect(portraitBox.x, portraitBox.y, portraitBox.w, portraitBox.h);
      oCtx.strokeStyle = '#cbd5e1';
      oCtx.lineWidth = 2;
      oCtx.strokeRect(portraitBox.x, portraitBox.y, portraitBox.w, portraitBox.h);

      // 繪製底圖（面型與髮型）
      oCtx.save();
      oCtx.translate(portraitBox.x, portraitBox.y);
      oCtx.drawImage(canvas, 0, 0, portraitBox.w, portraitBox.h);

      const scaleToCanvasX = portraitBox.w / gameState.logicalWidth;
      const scaleToCanvasY = portraitBox.h / gameState.logicalHeight;

      // 將學生擺放並調整過大小的五官依序繪入作品卡
      for (const [key, part] of Object.entries(gameState.partsOnCanvas)) {
        const svgStr = partSVGs[key];
        const img = new Image();
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        img.onload = function() {
          oCtx.save();
          const targetW = part.width * scaleToCanvasX * part.scale;
          const targetH = part.height * scaleToCanvasY * part.scale;
          const posX = part.x * scaleToCanvasX;
          const posY = part.y * scaleToCanvasY;

          oCtx.translate(posX, posY);
          oCtx.rotate((part.rotation * Math.PI) / 180);
          oCtx.drawImage(img, -targetW / 2, -targetH / 2, targetW, targetH);
          oCtx.restore();
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }
      oCtx.restore();

      setTimeout(() => {
        oCtx.fillStyle = '#f1f5f9';
        oCtx.roundRect(80, 830, 740, 130, 12);
        oCtx.fill();

        oCtx.fillStyle = '#0f172a';
        oCtx.font = 'bold 20px sans-serif';
        oCtx.textAlign = 'left';
        oCtx.fillText(`學習成果評價：${document.getElementById('res-score').innerText}`, 110, 870);

        oCtx.fillStyle = '#334155';
        oCtx.font = '16px sans-serif';
        oCtx.fillText('★ 掌握技巧：橫三等分(1/3)、直五等分(1/5)比例劃分 | 自主比例微調與自我肯定', 110, 905);
        oCtx.fillText('教師批閱評語：_______________________________    簽署：___________', 110, 938);

        const link = document.createElement('a');
        const filename = `${gameState.userClass}_${gameState.userNo}_${gameState.userName}_自畫像.png`;
        link.download = filename;
        link.href = offCanvas.toDataURL('image/png');
        link.click();
      }, 300);
    }
